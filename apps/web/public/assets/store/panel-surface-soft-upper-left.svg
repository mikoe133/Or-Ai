<svg xmlns="http://www.w3.org/2000/svg" width="1296" height="800" viewBox="0 0 1296 800">
<defs>
  <clipPath id="inner-right-cut"><rect width="1282" height="800"/></clipPath>
  <linearGradient id="left-edge-horizontal-softness" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="32" y2="0">
    <stop stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".2" stop-color="#FFFFFF" stop-opacity=".01"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".25"/>
    <stop offset=".8" stop-color="#FFFFFF" stop-opacity=".75"/>
    <stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
  <linearGradient id="left-edge-vertical-reveal" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="210">
    <stop stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".2" stop-color="#FFFFFF" stop-opacity=".03"/>
    <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".4"/>
    <stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
  <mask id="soft-upper-left-alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="1296" height="800" style="mask-type:alpha">
    <rect width="1296" height="800" fill="url(#left-edge-horizontal-softness)"/>
    <rect width="32" height="800" fill="url(#left-edge-vertical-reveal)"/>
  </mask>
</defs>
<rect width="1296" height="800" fill="#FFFFFF" fill-opacity="0"/>
<g id="Panel-surface-kept-inside-right-inner-contour" clip-path="url(#inner-right-cut)">
  <g id="Upper-left-surface-feathers-to-transparent" mask="url(#soft-upper-left-alpha)">
    <rect width="1296" height="800" rx="28" fill="#191B24" fill-opacity=".96"/>
  </g>
