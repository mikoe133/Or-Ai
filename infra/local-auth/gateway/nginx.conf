worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_origin $origin_allowed {
        default 0;
        "" 1;
        "http://127.0.0.1:__WEB_PORT__" 1;
    }
    map $http_origin $cors_origin {
        default "";
        "http://127.0.0.1:__WEB_PORT__" $http_origin;
    }
    server {
        listen 8080;
        server_name _;
        client_max_body_size 1m;
        location /auth/v1/ {
            if ($origin_allowed = 0) { return 403; }
            # Match the standard Supabase base URL without changing Auth JWT
            # issuer validation. Auth itself verifies credentials on its routes.
            proxy_pass http://auth:9999/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin $cors_origin always;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
        location / { return 404; }
    }
}
