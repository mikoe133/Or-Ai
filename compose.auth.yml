# Local operator Auth only. Independent from docker-compose.yml and orai_pgdata.
name: orai-auth-local
services:
  auth-db:
    image: orai-local-auth-db:pg17.10
    build:
      context: infra/local-auth/database
    environment:
      POSTGRES_USER: auth_owner
      POSTGRES_DB: orai_auth
      POSTGRES_PASSWORD: ${LOCAL_AUTH_DB_PASSWORD:?Run pnpm auth:setup first}
    volumes:
      - auth-pgdata:/var/lib/postgresql/data
    networks: [auth-internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U auth_owner -d orai_auth']
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
  auth:
    image: supabase/gotrue:v2.197.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:${LOCAL_AUTH_PORT:-54321}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${LOCAL_AUTH_DB_PASSWORD:?Run pnpm auth:setup first}@auth-db:5432/orai_auth?search_path=auth
      GOTRUE_DB_MAX_POOL_SIZE: 5
      GOTRUE_SITE_URL: http://127.0.0.1:${WEB_PORT:-5173}
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:${WEB_PORT:-5173}/auth/callback?sb_flow_id=*,http://127.0.0.1:${WEB_PORT:-5173}/auth/reset?sb_flow_id=*
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${LOCAL_AUTH_JWT_SECRET:?Run pnpm auth:setup first}
      GOTRUE_JWT_ISSUER: http://127.0.0.1:${LOCAL_AUTH_PORT:-54321}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@orai.test
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: Orai Local
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 60
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      LOG_LEVEL: error
    depends_on:
      auth-db: { condition: service_healthy }
      mail: { condition: service_healthy }
    networks: [auth-internal]
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:9999/health]
      interval: 3s
      timeout: 3s
      retries: 25
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  gateway:
    image: orai-local-auth-gateway:nginx1.28.3
    build:
      context: infra/local-auth/gateway
    user: '101:101'
    ports:
      - 127.0.0.1:${LOCAL_AUTH_PORT:-54321}:8080
    networks: [default, auth-internal]
    depends_on:
      auth: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:8080/auth/v1/health]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mail:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 100
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_WEBROOT: /
    volumes:
      - auth-maildata:/data
    ports:
      - 127.0.0.1:${LOCAL_MAIL_PORT:-54324}:8025
    networks: [default, auth-internal]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  auth-internal:
    internal: true
volumes:
  auth-pgdata:
  auth-maildata:
