name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      MIGRATION_DATABASE_URL: postgresql://orai:${{ github.run_id }}@127.0.0.1:55432/orai_test?schema=orai
      DATABASE_URL: postgresql://orai_app:${{ github.run_id }}-app@127.0.0.1:55432/orai_test?schema=orai
      DEMO_SEED_DATABASE: orai_test
      DATABASE_SSL_MODE: disable
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_USER: orai
          POSTGRES_DB: orai_test
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U orai -d orai_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:toolchain
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm db:validate
      - run: pnpm db:migrate
      - run: pnpm db:provision
      - run: pnpm db:seed
      - run: pnpm test
      - name: Build Linux API image
        run: docker build --platform linux/amd64 -f apps/api/Dockerfile -t orai-api:ci .
