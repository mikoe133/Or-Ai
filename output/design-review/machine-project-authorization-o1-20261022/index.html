-header h2{font-size:17px}.active-header>span{display:none}.steps{gap:21px}.step{grid-template-columns:23px 1fr;gap:9px}.step p{font-size:10px}.connection-actions{gap:8px}.connection-actions button{font-size:11px}.review-switch{margin-top:25px;padding-top:15px;gap:7px}.review-switch>span{width:100%}.dialog-head{padding:19px 18px 16px}.dialog-head h2{font-size:18px}.dialog-body{padding:17px 18px}.dialog-body>p{font-size:10px;margin-bottom:16px}.dialog-body .summary-body dd{font-size:11px}.dialog-footer{padding:14px 18px 17px;gap:13px}.dialog-actions button{min-height:40px;padding:8px 12px;font-size:11px}.consent{font-size:10px}.end-state{padding:16px}.end-state p{font-size:11px}#toast{bottom:16px;left:50%;width:calc(100% - 32px)}

<body>
<div class="app"><aside class="sidebar" aria-label="后台导航"><div class="brand"><svg viewBox="0 0 26 26" fill="none" aria-hidden="true"><circle cx="13" cy="13" r="10.5" stroke="currentColor" stroke-width="1.6"/><path d="m3 13 4 3 3-6 3 8 3-5 3 2 4-4" stroke="currentColor" stroke-width="1.6"/></svg><div><strong>meetmyworld</strong><small>运营后台</small></div></div><div class="nav-label">工作空间 <span style="float:right">01</span></div><nav><button class="nav-item"><span>▦</span>概览与审计</button><button class="nav-item"><span>▢</span>商品与版本</button><button class="nav-item"><span>▤</span>内容工作台</button><button class="nav-item"><span>▧</span>素材与文件</button><button class="nav-item"><span>▱</span>skill 库</button><button class="nav-item" aria-current="page"><span>♧</span>Codex 连接</button><button class="nav-item"><span>▣</span>订单与售后</button></nav><footer><div class="account"><span class="avatar">M</span><div>管理员<small>设计演示身份</small></div></div><div class="brand-foot">MEETMYWORLD / OPERATIONS</div></footer></aside><header class="topbar"><div><button class="mobile-menu" aria-label="后台导航示意" onclick="notify('本原型只演示 Codex 连接流程')">☰</button><span>运营后台</span><b>/　Codex 连接</b></div><div class="preview-mark"><i></i>设计预览 · 仅内存演示<span class="avatar">M</span></div></header><main class="work" aria-label="运营后台" id="work"><div id="view"></div><nav class="review-switch" aria-label="设计场景"></nav></main></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-frame"><header class="dialog-head"><h2 id="dialog-title"></h2><button type="button" aria-label="关闭对话框" onclick="closeDialog()">×</button></header><div class="dialog-body" id="dialog-body"></div><footer class="dialog-footer" id="dialog-footer"></footer></div></dialog><div id="toast" role="status" hidden></div>
<script>
const reference=Date.parse('2026-10-22T18:00:00+08:00');
const domainNames={assessment:'题目与报告',cover:'封面图片',video:'宣传视频',copy:'引流文案',experience:'网页与交互'};
const categoryNames={relationships:'关系探索',self:'自我认识',expression:'情绪与表达'};
const skillOptions=[{id:'dialogue',name:'温和对话',domain:'assessment'},{id:'copy',name:'清晰表达',domain:'copy'}];
const actionNames={create:'创建商品项目',skills:'使用允许的 Skill',upload:'上传商品草稿'};
const escapeText=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function defaults(){return {name:'我的 Codex',workspace:'auto',categories:['relationships'],maxProjects:12,maxMethods:8,maxRuns:20,expires:'2026-10-29T18:00',actions:{create:false,skills:false,upload:false},domains:Object.fromEntries(Object.keys(domainNames).map(d=>[d,{enabled:d!=='experience',skills:true,upload:true}])),sharedSkills:[]};}
let draft=defaults(),active=null,status='setup',advancedOpen=false,scene='setup',returnFocus=null,toastTimer;
const view=document.getElementById('view'),work=document.getElementById('work'),dialog=document.getElementById('dialog');
function selectedDomains(config){return Object.keys(domainNames).filter(d=>config.domains[d].enabled);}
function permissions(config){return selectedDomains(config).map(domain=>{const choices=config.domains[domain],grants=new Set();
 if(config.actions.create&&domain==='assessment')for(const p of ['projects:read','projects:write','projects:create','context:read'])grants.add(p);
 if(config.actions.skills&&choices.skills)for(const p of ['projects:read','skills:read','context:read','methods:create'])grants.add(p);
 if(config.actions.upload&&choices.upload)for(const p of ['projects:read','content:read','content:write','context:read'])grants.add(p);
 return {domain,grants:[...grants]};}).filter(row=>row.grants.length);}
function grantedDomains(config,action){return selectedDomains(config).filter(d=>config.domains[d][action]);}
function formatTime(value){return value.replaceAll('-','/').replace('T',' ');}
function validate(config){const errors=[],domains=selectedDomains(config),expiry=Date.parse(config.expires);
 if(!Object.values(config.actions).some(Boolean))errors.push('请先选择至少一项允许 Codex 做的事。');
 if(!config.name.trim())errors.push('请填写连接名称。');
 if(!domains.length)errors.push('请在高级设置中至少保留一种内容。');
 if(!config.categories.length)errors.push('请至少保留一种允许创建的商品分类。');
 if(config.actions.create&&!config.domains.assessment.enabled)errors.push('创建商品项目需要保留“题目与报告”内容范围。');
 if(config.actions.skills&&!grantedDomains(config,'skills').length)errors.push('请为至少一种内容允许读取 Skill。');
 if(config.actions.upload&&!config.actions.skills)errors.push('上传草稿需要同时允许使用 Skill；请由你勾选该项。');
 if(config.actions.upload&&!grantedDomains(config,'upload').length)errors.push('请为至少一种内容允许上传草稿。');
 if(config.actions.upload&&grantedDomains(config,'upload').some(d=>!config.domains[d].skills))errors.push('允许上传的内容也需要读取所属 Skill；请在高级设置中核对。');
 for(const [key,label] of [['maxProjects','新商品数量'],['maxMethods','每商品方法数量'],['maxRuns','每商品制作批次']])if(!Number.isInteger(Number(config[key]))||config[key]<1||config[key]>100)errors.push(label+'应在 1–100 之间。');
 if(!Number.isFinite(expiry)||expiry<=reference+60000||expiry>reference+90*86400000)errors.push('到期时间应在示例起算时间的 1 分钟至 90 天内。');
 if(config.workspace==='existing'&&expiry>Date.parse('2026-10-30T18:00'))errors.push('连接不能晚于所选工作区到期时间：2026/10/30 18:00。');
 return errors;}
function summaryHtml(config){const rows=permissions(config),allowed=[];
 if(config.actions.create)allowed.push('在允许分类内创建商品与计划草稿');
 if(config.actions.skills)allowed.push('读取并固定 '+grantedDomains(config,'skills').map(d=>domainNames[d]).join('、')+' 的商品方法');
 if(config.actions.upload)allowed.push('上传 '+grantedDomains(config,'upload').map(d=>domainNames[d]).join('、')+' 草稿');
 const libraries=skillOptions.filter(s=>config.sharedSkills.includes(s.id)&&config.domains[s.domain].enabled).map(s=>s.name);
 return `<div class="summary-body"><dl><dt>允许做的事</dt><dd data-summary="actions">${allowed.length?'<ul>'+allowed.map(t=>'<li>'+escapeText(t)+'</li>').join('')+'</ul>':'<span class="none">尚未允许任何操作</span>'}</dd><dt>能访问的商品</dt><dd data-summary="scope">${config.workspace==='existing'?'“我的制作空间”已有的 3 个商品，以及后续归入的商品。':'仅限本连接创建并归入的商品。'}<br>分类：${config.categories.map(c=>categoryNames[c]).join('、')||'尚未选择'}</dd><dt>Skill 范围</dt><dd data-summary="skills">${config.actions.skills?'本连接商品的方法；共享库：'+(libraries.join('、')||'尚未授权'):'尚未允许读取 Skill'}</dd><dt>额度与到期</dt><dd data-summary="limits">${config.workspace==='existing'?'最多再建 9 个商品（总额度 12 个）':'最多新建 '+escapeText(config.maxProjects)+' 个商品'} · 每商品 ${escapeText(config.maxMethods)} 个方法 / ${escapeText(config.maxRuns)} 次制作批次<br>到期：${escapeText(formatTime(config.expires))}（上海时间）</dd><dt>授权边界</dt><dd class="restricted">不能审核或上架，不能修改共享 Skill 库；不能读取用户答卷和个人报告。<br>${rows.length?rows.length+' 个领域分别授权，彼此不能代用。':'各内容领域分别授权。'}</dd></dl></div>`;}
function heading(title,description){return `<header class="heading"><div class="eyebrow">YOUR CODEX / CONTENT STUDIO</div><h1>${title}</h1><p>${description}</p></header>`;}
function summaryPanel(config){return `<aside class="summary" aria-label="连接权限摘要"><div class="section-title"><h2>这次连接允许什么</h2><small>确认前请核对</small></div><div id="live-summary">${summaryHtml(config)}</div><p class="preview-note">这是设计预览。连接、复制和撤销都只在本页演示，不会创建真实凭据或更改 Codex 配置。</p></aside>`;}
function advancedHtml(){const locked=draft.workspace==='existing';return `<details class="advanced" id="advanced" ${advancedOpen?'open':''}><summary>高级设置 <small>可选 · 一次设置，后续商品复用</small></summary><div class="advanced-body"><section class="settings-section"><h3>连接与商品范围</h3><div class="fields"><label class="field">连接名称<input name="name" value="${escapeText(draft.name)}" maxlength="100" required></label><label class="field">项目归组（工作区）<select name="workspace" aria-label="项目归组"><option value="auto" ${!locked?'selected':''}>自动建立我的制作空间</option><option value="existing" ${locked?'selected':''}>沿用我的制作空间 · 已有 3 个商品</option><option disabled>已到期的空间 · 不可选择</option><option disabled>已撤销的空间 · 不可选择</option></select><small>仅当前管理员自己的私有空间。</small></label><fieldset class="wide"><legend>允许的商品分类</legend><div class="chips">${Object.entries(categoryNames).map(([key,name])=>`<label class="chip"><input type="checkbox" name="category" value="${key}" ${draft.categories.includes(key)?'checked':''} ${locked?'disabled':''}>${name}</label>`).join('')}</div>${locked?'<p class="hint">现有工作区的范围与额度固定；更换工作区后会重新显示授权摘要。</p>':''}</fieldset></div></section><section class="settings-section"><h3>各类内容的访问权限</h3><p>主页面勾选操作后，才会请求下方对应权限；取消某一类只会缩小范围。新建商品与共同计划仅由题目与报告连接负责。</p><table class="domain-table"><thead><tr><th>允许的内容</th><th>读取 Skill</th><th>上传草稿</th></tr></thead><tbody>${Object.entries(domainNames).map(([key,name])=>`<tr><td><label><input type="checkbox" name="domain" value="${key}" ${draft.domains[key].enabled?'checked':''}>${name}</label></td><td><label><input type="checkbox" aria-label="${name}读取 Skill" name="domain-skill" value="${key}" ${draft.domains[key].skills?'checked':''} ${!draft.domains[key].enabled?'disabled':''}><span hidden>读取</span></label></td><td><label><input type="checkbox" aria-label="${name}上传草稿" name="domain-upload" value="${key}" ${draft.domains[key].upload?'checked':''} ${!draft.domains[key].enabled?'disabled':''}><span hidden>上传</span></label></td></tr>`).join('')}</tbody></table><p class="hint">这里是待确认的范围，不会自动勾选主页面的操作，也不会产生实际授权。</p></section><section class="settings-section"><h3>允许使用的共享 Skill（可选）</h3><p>不选择时，仅可处理本连接商品自己的方法。共享库只读，商品定制版本另存。</p>${skillOptions.map(skill=>`<label class="skill-choice"><input type="checkbox" name="shared-skill" value="${skill.id}" ${draft.sharedSkills.includes(skill.id)?'checked':''} ${!draft.domains[skill.domain].enabled?'disabled':''}><span>${skill.name}<small>${domainNames[skill.domain]} · 示例 Skill</small></span></label>`).join('')}</section><section class="settings-section"><h3>数量与有效期</h3><div class="fields"><label class="field">最多新建商品数<input aria-label="最多新建商品数" name="maxProjects" type="number" min="1" max="100" value="${draft.maxProjects}" ${locked?'disabled':''} required><small>${locked?'已用 3 个，最多再建 9 个。':'累计 1–100 个，不必每个商品重建连接。'}</small></label><label class="field">每商品方法上限<input aria-label="每商品方法上限" name="maxMethods" type="number" min="1" max="100" value="${draft.maxMethods}" ${locked?'disabled':''} required><small>1–100 个，限制商品定制方法。</small></label><label class="field">每商品制作批次上限<input aria-label="每商品制作批次上限" name="maxRuns" type="number" min="1" max="100" value="${draft.maxRuns}" ${locked?'disabled':''} required><small>1–100 次，仅限制记录，不启动制作。</small></label><label class="field">连接到期时间<input aria-label="连接到期时间" name="expires" type="datetime-local" value="${escapeText(draft.expires)}" required><small>${locked?'不得晚于空间到期：2026/10/30 18:00。':'最长 90 天。空间与连接同日到期。'}</small></label></div><p class="hint">设计示例起算：2026/10/22 18:00，Asia/Shanghai。超额或到期后停止新建和写入，已保存的成果仍保留。</p></section></div></details>`;}
function setupHtml(){return heading('连接我的 Codex','让 Codex 帮你创建商品、使用允许的 Skill、上传题目和宣传素材草稿。一次连接，后续多个商品都可沿用。')+`<div class="layout"><section class="panel"><div class="section-title"><h2>你希望 Codex 帮你做什么？</h2><small>由你选择允许的操作</small></div><form id="setup" novalidate><fieldset aria-label="允许 Codex 做的事">${[['create','创建商品项目','根据选题建立商品和制作计划，先保存为草稿。'],['skills','使用允许的 Skill','读取允许的方法，为商品保存独立的方法版本；共享库保持原样。'],['upload','上传商品草稿','上传题目、报告方案、封面、视频或文案，留给你查看和审核。']].map(([key,title,desc])=>`<label class="action-choice"><input type="checkbox" name="action" value="${key}" ${draft.actions[key]?'checked':''}><span><strong>${title}</strong><p>${desc}</p></span></label>`).join('')}</fieldset><div class="business-boundary"><span>↳</span><span>审核和上架仍由你操作。Codex 不能读取用户答卷和个人报告。</span></div>${advancedHtml()}<p id="setup-error" class="error" role="alert" hidden></p></form></section>${summaryPanel(draft)}</div><div class="setup-actions" style="max-width:1300px"><small>先核对权限摘要，再由你确认连接。<br>内容制作和定时任务需要之后另行安排。</small><button type="submit" form="setup" class="primary" id="connect-button" ${!Object.values(draft.actions).some(Boolean)?'disabled':''}>连接我的 Codex</button></div>`;}
function activeHtml(){return heading('我的 Codex 连接','后续商品沿用这份连接范围。你可以随时查看权限或撤销访问，不用每做一款商品重新配置。')+`<div class="layout"><section class="panel"><div class="active-header"><div><h2>${escapeText(active.name)}</h2><span class="state-badge">授权方案已确认 · 演示</span></div><span class="avatar">C</span></div><p style="font-size:12px">下一步，在 Codex 中添加这份连接说明。本页没有实际签发密钥，也没有改动你的客户端。</p><div class="steps"><div class="step"><span>01</span><div><h3>获取这份连接说明</h3><p>内容领域各自有独立授权，说明会列出允许的范围；这里不展示真实凭据。</p><button class="primary" onclick="openCopy()">复制连接说明（演示）</button></div></div><div class="step"><span>02</span><div><h3>在 Codex 中添加，然后按商品继续制作</h3><p>保留同一个商品项目和固定方法版本，制作后的内容作为草稿回到后台；审核和上架仍由你决定。</p></div></div></div><div class="connection-actions"><button onclick="openPermissions()">查看权限</button><button class="danger" id="revoke-trigger" onclick="openRevoke()">撤销连接</button></div></section>${summaryPanel(active)}</div>`;}
function offHtml(){const expired=status==='expired';return heading(expired?'连接已到期':'连接已撤销',expired?'这份连接已停止授权。需要继续时，重新核对范围并确认；已有商品和成果保留。':'Codex 将不能再通过这份连接访问商品或上传草稿。已经保存的商品、方法和成果保留。')+`<div class="layout"><section class="panel"><div class="active-header"><div><h2>${escapeText(active.name)}</h2><span class="state-badge off">${expired?'已到期':'已撤销'} · 演示</span></div></div><div class="end-state"><h2>这份连接不再提供访问权限</h2><p>${expired?'到期的连接不能继续复制为有效配置。':'撤销只停止该连接的访问，不删除历史内容，也不代表已终止第三方作业。'}未来需要制作时，须重新确认连接。</p></div><div class="connection-actions"><button disabled>复制连接说明</button><button class="primary" onclick="startAgain()">重新设置连接</button></div></section><aside class="summary"><div class="section-title"><h2>原授权记录</h2><small>当前已不生效</small></div>${summaryHtml(active)}<p class="preview-note">设计预览：此状态没有撤销真实凭据。</p></aside></div>`;}
function bindSetup(){const form=document.getElementById('setup');if(!form)return;
 document.getElementById('advanced').addEventListener('toggle',event=>advancedOpen=event.target.open);
 form.addEventListener('input',event=>{const n=event.target;if(n.name==='name'||n.name==='expires')draft[n.name]=n.value;if(['maxProjects','maxMethods','maxRuns'].includes(n.name))draft[n.name]=n.value===''?'':Number(n.value);syncSummary();});
 form.addEventListener('change',event=>{const n=event.target;
 if(n.name==='action')draft.actions[n.value]=n.checked;
 if(n.name==='category')draft.categories=[...form.querySelectorAll('[name=category]:checked')].map(x=>x.value);
 if(n.name==='shared-skill')draft.sharedSkills=[...form.querySelectorAll('[name=shared-skill]:checked')].map(x=>x.value);
 if(n.name==='workspace'){draft.workspace=n.value;if(n.value==='existing'){draft.categories=['relationships','self'];draft.maxProjects=12;draft.maxMethods=8;draft.maxRuns=20;}render(false);document.querySelector('#setup [name=workspace]')?.focus({preventScroll:true});return;}
 if(n.name==='domain'){draft.domains[n.value].enabled=n.checked;if(!n.checked)draft.sharedSkills=draft.sharedSkills.filter(id=>skillOptions.find(s=>s.id===id).domain!==n.value);render(false);document.querySelector('#setup [name=domain][value="'+n.value+'"]')?.focus({preventScroll:true});return;}
 if(n.name==='domain-skill')draft.domains[n.value].skills=n.checked;
 if(n.name==='domain-upload')draft.domains[n.value].upload=n.checked;
 syncSummary();});
 form.addEventListener('submit',event=>{event.preventDefault();const errors=validate(draft);if(errors.length){const box=document.getElementById('setup-error');box.hidden=false;box.textContent=errors.join(' ');box.scrollIntoView({block:'nearest'});return;}document.getElementById('setup-error').hidden=true;openConfirm();});}
function syncSummary(){const error=document.getElementById('setup-error');if(error&&!error.hidden){const issues=validate(draft);error.hidden=!issues.length;error.textContent=issues.join(' ');}const box=document.getElementById('live-summary');if(box)box.innerHTML=summaryHtml(status==='setup'?draft:active);const button=document.getElementById('connect-button');if(button)button.disabled=!Object.values(draft.actions).some(Boolean);}
function render(reset=true){const scroll=work.scrollTop;view.innerHTML=status==='setup'?setupHtml():status==='active'?activeHtml():offHtml();bindSetup();work.scrollTop=reset?0:scroll;document.querySelector('.review-switch').innerHTML='<span>评审场景 · 仅示例</span>'+Object.entries({setup:'首次连接',selected:'已选择操作',advanced:'高级设置',active:'确认后示意',revoked:'撤销后',expired:'到期后'}).map(([key,title])=>`<button ${scene===key?'aria-current="page"':''} onclick="showScene('${key}')">${title}</button>`).join('');}
function showDialog(title,body,footer){returnFocus=document.activeElement;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=body;document.getElementById('dialog-footer').innerHTML=footer;dialog.showModal();}
function closeDialog(){dialog.close();}
// Native dialog restores focus to the invoking control on close/Escape.
function openConfirm(){const fixed=structuredClone(draft);showDialog('确认连接范围','<div class="focus-note">设计预览 · 尚未授予任何权限</div><p>请核对以下范围。只有你在下方明确确认后，本页才切换到连接示意。</p>'+summaryHtml(fixed),'<label class="consent"><input type="checkbox" id="consent">我允许按上方列出的操作、商品、Skill 范围和有效期建立连接。</label><div class="dialog-actions"><button onclick="closeDialog()">返回修改</button><button class="primary" id="confirm-connect" disabled>确认连接（演示）</button></div>');document.getElementById('consent').addEventListener('change',e=>document.getElementById('confirm-connect').disabled=!e.target.checked);document.getElementById('confirm-connect').addEventListener('click',()=>{if(!document.getElementById('consent').checked)return;active=fixed;status='active';scene='active';closeDialog();render();notify('仅内存演示：没有签发凭据，也没有连接真实 Codex。');});}
function openPermissions(){showDialog('查看连接权限','<p>以下是这份已确认的演示范围，不会因查看而扩大授权。</p>'+summaryHtml(active),'<div class="dialog-actions"><button onclick="closeDialog()">关闭</button></div>');}
function openCopy(){const rows=permissions(active);showDialog('连接说明预览','<p>正式交接会为下列内容领域分别安排授权，后续商品沿用同一份连接。</p><div class="copy-preview">'+escapeText(['【设计示例，不可用于真实接入】','名称：'+active.name,'内容：'+rows.map(r=>domainNames[r.domain]).join('、'),'有效期：'+formatTime(active.expires),'凭据：<正式签发后安全注入；本页没有真实密钥>','审核与上架：仅由管理员操作','日程：尚未启用'].join('\n'))+'</div><p class="preview-note">本演示不会写入剪贴板、文件或 Codex 配置。</p>','<div class="dialog-actions"><button onclick="closeDialog()">关闭</button><button class="primary" onclick="notify(\'复制行为演示：没有写入剪贴板或客户端配置。\')">复制说明（演示）</button></div>');}
function openRevoke(){showDialog('撤销我的 Codex 连接？','<p>撤销后，这份连接内各领域将停止访问商品和上传草稿。历史商品、方法与成果保留；不代表已停止第三方正在执行的作业。</p>'+summaryHtml(active),'<div class="dialog-actions"><button onclick="closeDialog()">保留连接</button><button class="danger" id="confirm-revoke">确认撤销（演示）</button></div>');document.getElementById('confirm-revoke').addEventListener('click',()=>{status='revoked';scene='revoked';closeDialog();render();notify('仅内存演示：未撤销任何真实凭据。');});}
function startAgain(){draft=defaults();active=null;status='setup';scene='setup';advancedOpen=false;render();}
function notify(message){const box=document.getElementById('toast');box.textContent=message;box.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.hidden=true,6500);}
function showScene(next){if(dialog.open)dialog.close();draft=defaults();advancedOpen=false;active=null;status='setup';scene=next;
 if(next!=='setup'){draft.actions={create:true,skills:true,upload:true};draft.sharedSkills=['dialogue','copy'];}
 if(next==='advanced')advancedOpen=true;
 if(['active','revoked','expired'].includes(next)){active=structuredClone(draft);status=next;}
 render();}
showScene(new URL(location.href).searchParams.get('scene')||'setup');
</script></body></html>
