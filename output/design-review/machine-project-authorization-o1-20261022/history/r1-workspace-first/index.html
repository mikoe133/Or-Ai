;padding:15px}.secret-demo code{font-size:10px;letter-spacing:.02em}.handoff-body{grid-template-columns:27px minmax(0,1fr);padding-top:20px;margin-top:20px}.handoff-body p{font-size:11px}.review-switch{margin-top:25px;gap:8px}#toast{left:50%;bottom:18px;width:calc(100% - 34px);max-width:500px}.form-panel:has(form) .form-actions{position:sticky;bottom:-26px;background:var(--panel);padding:15px 0 12px;margin-bottom:-10px;z-index:2}.form-panel:has(form){overflow:visible}.field small{font-size:10px}.work{scroll-padding-bottom:80px}}

<body>
<div class="app">
<aside class="sidebar" aria-label="后台导航">
 <div class="brand"><svg viewBox="0 0 26 26" fill="none" aria-hidden="true"><circle cx="13" cy="13" r="10.5" stroke="currentColor" stroke-width="1.6"/><path d="m3 13 4 3 3-6 3 8 3-5 3 2 4-4" stroke="currentColor" stroke-width="1.6"/></svg><div><strong>meetmyworld</strong><small>运营后台</small></div></div>
 <div class="nav-label">工作空间 <span style="float:right">01</span></div>
 <nav><button class="nav-item"><span>▦</span>概览与审计</button><button class="nav-item"><span>▢</span>商品与版本</button><button class="nav-item"><span>▤</span>内容工作台</button><button class="nav-item"><span>▧</span>素材与文件</button><button class="nav-item"><span>▱</span>skill 库</button><button class="nav-item" aria-current="page" onclick="show('list')"><span>♧</span>MCP 连接</button><button class="nav-item"><span>▣</span>订单与售后</button></nav>
 <footer><div class="account"><span class="avatar">M</span><div>管理员<small>设计演示身份</small></div></div><div class="brand-foot">MEETMYWORLD / OPERATIONS</div></footer>
</aside>
<header class="topbar"><div><button class="mobile-menu" aria-label="后台导航示意" onclick="notify('导航沿用现有后台；本原型只演示 MCP 授权')">☰</button><span>运营后台</span><b>/　MCP 连接</b></div><div class="preview-mark"><i></i>设计预览 · 示例数据<span class="avatar">M</span></div></header>
<main class="work" id="work" aria-label="运营后台"><div id="view"></div><nav class="review-switch" aria-label="设计场景"><span>评审场景</span></nav></main>
</div>
<div id="toast" role="status" hidden></div>
<dialog id="revoke" aria-labelledby="revoke-title"><h2 id="revoke-title">撤销工作区授权？</h2><p>关系探索 · 制作试点</p><p>该工作区下的连接将停止访问这些项目。已保存的商品、方法和历史成果保留；需要继续制作时须重新安排授权。</p><div class="form-actions"><button onclick="document.getElementById('revoke').close()">取消</button><button class="danger" onclick="document.getElementById('revoke').close();show('revoked');notify('设计演示：已切换到撤销状态，没有修改实际授权')">确认撤销</button></div></dialog>
<script>
const scenes={list:'工作区列表',create:'创建工作区',connection:'连接权限',handoff:'连接交接',revoked:'已撤销',empty:'空工作区'};
let scene='list',domain='assessment',demoCreated=false;
const view=document.getElementById('view'),work=document.getElementById('work');
const escapeText=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let draftName='关系探索 · 制作试点';
const heading=(title,description,action='')=>`<div class="heading"><div><div class="eyebrow">INTEGRATIONS / MCP</div><h1>${title}</h1><p>${description}</p></div>${action}</div>`;
const tabs=active=>`<div class="tabs" role="tablist" aria-label="MCP 管理"><button role="tab" aria-selected="${active==='connections'}" onclick="show('connection')">连接凭据</button><button role="tab" aria-selected="${active==='workspaces'}" onclick="show('list')">项目工作区</button></div>`;
const scope=()=>`<div class="scope-note">演示范围 / DEMO <span>工作区限定可创建项目的范围和数量；每个连接仍按领域独立授权。</span></div>`;
const summary=(connection=false)=>`<aside class="summary"><h2>${connection?'连接授权摘要':'工作区授权摘要'}</h2><details ${innerWidth>1100?'open':''}><summary>${connection?'查看连接授权摘要':'查看工作区授权摘要'}</summary><dl><dt>${connection?'所选工作区':'允许分类'}</dt><dd>${connection?escapeText(draftName):'关系探索、自我认识'}</dd><dt>${connection?'内容领域':'可新建项目'}</dt><dd>${connection?domainLabel():'<strong>12</strong> 个'}</dd><dt>${connection?'项目访问':'每项目方法上限'}</dt><dd>${connection?'工作区内项目':'8 个'}</dd><dt>${connection?'连接到期':'每项目运行批次'}</dt><dd>${connection?'2026/10/29 18:00':'20 次'}</dd><dt>工作区到期</dt><dd>2026/10/29 18:00</dd></dl><p>${connection?'新商品和新方法须由已授权的项目流程加入工作区，不能由调用方自行扩大范围。':'数量和分类由服务端复核。创建工作区后，还需为各制作领域分别安排连接。'}</p></details></aside>`;
function domainLabel(){return {assessment:'题目与报告',cover:'封面图片',video:'宣传视频',copy:'引流文案',experience:'体验与报告呈现'}[domain];}
function workspaceRow(revoked=false){return `<article class="workspace-row" aria-label="工作区 ${escapeText(draftName)}"><div><h3>${escapeText(draftName)}</h3><p>关系探索 / 自我认识</p><small>本管理员创建 · 演示范围</small></div><div class="row-count"><small>已创建 / 项目额度</small><div><strong>${demoCreated?'0':'3'} <small>/ 12 个</small></strong></div><span class="meter"><i style="width:${demoCreated?'0':'25'}%"></i></span><small>每项目 8 个方法 · 20 次运行</small></div><div class="row-validity"><span class="badge ${revoked?'muted':''}">${revoked?'已撤销':'有效'}</span><p style="margin-top:9px">到期 2026/10/29 18:00</p><small>${revoked?'2026/10/22 16:00 撤销':'仅当前管理员可安排连接'}</small></div><div class="row-actions"><button ${revoked?'disabled':''} onclick="show('connection')">为此工作区创建连接</button>${revoked?'':`<button class="quiet danger" onclick="document.getElementById('revoke').showModal()">撤销工作区</button>`}</div></article>`;}
function listScene(revoked=false,empty=false){return heading('MCP 连接','先限定项目工作区，再为题目、封面、视频和文案分别安排连接。','<button class="primary" onclick="show(\'create\')">创建项目工作区 ↗</button>')+tabs('workspaces')+scope()+(revoked?'<div class="notice">该工作区已撤销，相关连接不能继续访问项目。历史商品、方法和成果仍可在内容工作台查看。</div>':'')+`<section><div class="section-title"><h2>项目工作区</h2><span>${empty?'0':'1'} 个工作区 · 设计示例</span></div>${empty?'<div class="empty"><div class="empty-symbol">▱</div><h2>还没有项目工作区</h2><p>为后续制作任务设定分类、项目数量和有效期。工作区创建后，才能安排可新建项目的连接。</p><button class="primary" onclick="show(\'create\')">创建第一个工作区</button></div>':'<div class="workspace-list">'+workspaceRow(revoked)+'</div>'}</section><p class="footnote">已有商品的固定范围连接继续可用。项目工作区用于受限地新建商品草稿和项目方法；创建授权不会发布商品或启用制作任务。</p>`;}
function createScene(){return heading('创建项目工作区','明确这批制作任务可以新建什么、创建多少，以及何时停止授权。','<button class="quiet" onclick="show(\'list\')">← 返回工作区</button>')+scope()+`<div class="form-layout"><section class="panel form-panel"><div class="panel-header"><h2>范围与额度</h2><span>01 / 创建授权</span></div><form id="workspace-form"><label class="field">工作区名称<input id="workspace-name" name="name" value="${escapeText(draftName)}" required maxlength="100"><small>便于区分不同批次的制作授权。</small></label><fieldset><legend>允许新建商品的分类</legend><div class="choices"><label class="choice"><input name="category" type="checkbox" value="relationships" checked>关系探索</label><label class="choice"><input name="category" type="checkbox" value="self" checked>自我认识</label><label class="choice"><input name="category" type="checkbox" value="expression">情绪与表达</label></div></fieldset><div class="divider"></div><div class="grid-two"><label class="field">最多创建项目数<input aria-label="最多创建项目数" name="projects" type="number" min="1" max="100" value="12" required><small>工作区累计数量，1–100 个。</small></label><label class="field">每个项目的方法上限<input aria-label="每个项目的方法上限" name="methods" type="number" min="1" max="100" value="8" required><small>限制项目方法数量，1–100 个。</small></label><label class="field">每个项目的运行批次上限<input aria-label="每个项目的运行批次上限" name="runs" type="number" min="1" max="100" value="20" required><small>只限制批次数，不启动任何运行。</small></label><label class="field">授权到期时间<input aria-label="授权到期时间" name="expiry" type="datetime-local" value="2026-10-29T18:00" required><small>Asia/Shanghai · 最长 90 天。</small></label></div><p id="form-error" class="error" role="alert" hidden></p><div class="form-actions"><button type="button" onclick="show('list')">取消</button><button class="primary" type="submit">创建工作区</button></div></form></section>${summary()}</div>`;}
function connectionScene(){const common=[['content:read','读取本领域内容','仅用于该领域已授权的草稿和素材。'],['skills:write','编辑本领域 Skill','按明确授权追加方法草稿和参考附件。'],['content:write','写入本领域草稿与媒体','产物保存为草稿，审核与采用仍由管理员操作。'],['skills:read','读取本领域 Skill','用于读取允许的基础方法及固定快照。'],['context:read','读取项目创作上下文','只返回制作所需的固定设定和授权输入。'],['projects:read','读取工作区项目与计划','跨领域仍不能读取完整私有计分或个人报告。'],['methods:create','创建项目方法','受工作区的每项目方法数量限制。']];if(domain==='assessment')common.push(['projects:write','追加共同设定与制作计划','修改以新修订保存，保留原计划。'],['projects:create','创建项目草稿','仅允许在该工作区分类与数量范围内创建。']);return heading('创建 MCP 连接','一个连接对应一个制作领域；各领域可共用同一工作区。','<button class="quiet" onclick="show(\'list\')">← 返回工作区</button>')+tabs('connections')+`<div class="segmented" aria-label="授权方式"><button aria-pressed="false" onclick="notify('已有商品授权沿用现有页面；本原型仅演示新增工作区模式')">指定已有内容</button><button aria-pressed="true">项目工作区</button></div><div class="form-layout"><section class="panel form-panel"><div class="panel-header"><h2>连接资料与权限</h2><span>02 / 安排领域连接</span></div><form id="connection-form"><div class="grid-two"><label class="field">连接名称<input required value="${domainLabel()} · 制作试点" maxlength="100"></label><label class="field">内容领域<select aria-label="内容领域" id="domain">${Object.entries({assessment:'题目与报告',cover:'封面图片',video:'宣传视频',copy:'引流文案',experience:'体验与报告呈现'}).map(([v,t])=>`<option value="${v}" ${domain===v?'selected':''}>${t}</option>`).join('')}</select></label></div><label class="field">所属项目工作区<select aria-label="所属项目工作区"><option>${escapeText(draftName)} · 有效 · 剩余 ${demoCreated?'12':'9'} 个项目</option><option disabled>已到期工作区 · 不可选择</option><option disabled>已撤销工作区 · 不可选择</option></select><small>仅可选择当前管理员、当前范围且仍有效的工作区。</small></label><label class="field">连接到期时间<input aria-label="连接到期时间" name="connection-expiry" type="datetime-local" value="2026-10-29T18:00" required><small>不能晚于工作区到期时间：2026/10/29 18:00。</small></label><fieldset class="permission-list"><legend>允许的操作 · ${domainLabel()}</legend>${common.map(([key,title,note])=>`<label class="permission"><input type="checkbox" name="grant" value="${key}" ${['skills:write','methods:create','projects:create'].includes(key)?'':'checked'}><span>${title}<small>${note}</small></span></label>`).join('')}</fieldset>${domain!=='assessment'?'<p class="subnote">新建商品与共同计划由题目与报告连接负责。本连接只处理所属领域的方法和产物。</p>':''}<div class="form-actions"><button type="button" onclick="show('list')">取消</button><button class="primary" type="submit">签发连接凭据</button></div></form></section>${summary(true)}</div>`;}
function handoffScene(){return heading('连接交接','把本连接的领域、范围和使用约束交给对应制作任务。','<button class="quiet" onclick="show(\'list\')">返回工作区</button>')+`<section class="panel"><div class="handoff-title"><span class="badge">签发后状态示意</span><h2>${domainLabel()} · 制作试点</h2></div><p style="font-size:12px">设计预览没有实际签发凭据；以下字段展示正式页面交接方式。</p><div class="secret-demo"><code>••••••••••••••••••••••••••••</code><button onclick="notify('设计演示：没有真实密钥，也没有修改剪贴板')">复制一次性凭据</button></div><div class="handoff-grid"><div class="field">所属工作区<small>${escapeText(draftName)} / 演示范围</small></div><div class="field">内容领域<small>${domainLabel()} / 独立领域授权</small></div><div class="field">到期时间<small>2026/10/29 18:00，Asia/Shanghai</small></div><div class="field">允许范围<small>工作区内项目；所选权限保持独立</small></div></div><div class="handoff-body"><span class="stepnum">01</span><div><h3>只把该连接交给对应领域任务</h3><p>将凭据保存在本地客户端的安全配置中。其他领域使用各自连接，平台不会在此安装或启用日程。</p></div><span class="stepnum">02</span><div><h3>制作时固定同一个计划与方法版本</h3><p>读取项目计划的精确修订和摘要，使用所属模块的固定 Skill 快照；新方法和产物仍留在同一项目内。</p></div><span class="stepnum">03</span><div><h3>中断后先读回执，再决定接续</h3><p>沿用原 run、模块与 requestId 核对保存结果。有原作业编号时先查询原作业，避免重复制作。</p></div></div><div class="form-actions"><button onclick="notify('设计演示：交接说明预览，未写入任何客户端配置')">复制交接说明</button><button class="primary" onclick="show('list');notify('设计演示：已隐藏示意凭据')">已保存，隐藏凭据</button></div></section>`;}
function show(next){scene=scenes[next]?next:'list';view.innerHTML=scene==='create'?createScene():scene==='connection'?connectionScene():scene==='handoff'?handoffScene():listScene(scene==='revoked',scene==='empty');work.scrollTop=0;document.querySelector('.review-switch').innerHTML='<span>评审场景</span>'+Object.entries(scenes).map(([id,label])=>`<button ${scene===id?'aria-current="page"':''} onclick="show('${id}')">${label}</button>`).join('');
 const ws=document.getElementById('workspace-form');if(ws)ws.addEventListener('input',()=>{const facts=document.querySelectorAll('.summary dd'),data=new FormData(ws);facts[0].textContent=[...ws.querySelectorAll('[name=category]:checked')].map(n=>n.parentElement.textContent.trim()).join('、')||'尚未选择分类';for(const [index,key,unit] of [[1,'projects',' 个'],[2,'methods',' 个'],[3,'runs',' 次']])facts[index].textContent=String(data.get(key)||'—')+unit;facts[4].textContent=String(data.get('expiry')).replace('T',' ');});if(ws)ws.addEventListener('submit',event=>{event.preventDefault();const data=new FormData(ws),error=document.getElementById('form-error');if(!data.getAll('category').length){error.hidden=false;error.textContent='请至少选择一个允许新建商品的分类。';return;}const expires=Date.parse(String(data.get('expiry'))),reference=Date.parse('2026-10-22T16:00:00+08:00');if(!Number.isFinite(expires)||expires<=reference+60000||expires>reference+90*86400000){error.hidden=false;error.textContent='授权到期应在示例时间的 1 分钟至 90 天内。';return;}draftName=String(data.get('name')).trim();if(!draftName){error.hidden=false;error.textContent='请填写工作区名称。';return;}demoCreated=true;show('list');notify('设计演示：工作区已加入本页示例，没有保存到业务后台');});
 const cf=document.getElementById('connection-form');if(cf){cf.addEventListener('input',()=>{document.querySelectorAll('.summary dd')[3].textContent=String(new FormData(cf).get('connection-expiry')).replace('T',' ');});cf.addEventListener('submit',event=>{event.preventDefault();const expires=Date.parse(String(new FormData(cf).get('connection-expiry')));if(expires>Date.parse('2026-10-29T18:00')||expires<=Date.parse('2026-10-22T16:01:00+08:00')){notify('连接必须在有效期内，且不能晚于工作区到期时间');return;}if(!new FormData(cf).getAll('grant').length){notify('请至少选择一项权限');return;}show('handoff');});document.getElementById('domain').addEventListener('change',event=>{domain=event.target.value;show('connection');});}}
let toastTimer;function notify(message){const t=document.getElementById('toast');t.textContent=message;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,6500);}
show(new URL(location.href).searchParams.get('scene')||'list');
</script>
</body>
</html>
